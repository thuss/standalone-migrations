name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
        activerecord:
          - '7.2'
          - '8.0'
          - '8.1'
        include:
          # Ruby 4.0 is not yet officially supported by Rails; tracked here so
          # breakage is visible, but not allowed to fail the build.
          - ruby: '4.0'
            activerecord: '8.1'
            experimental: true

    name: Ruby ${{ matrix.ruby }} / ActiveRecord ${{ matrix.activerecord }}
    env:
      AR: "~> ${{ matrix.activerecord }}"
      # jeweler is release-only tooling and does not install on modern Ruby
      BUNDLE_WITHOUT: release
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
